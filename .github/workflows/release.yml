name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional signing. Add these repository secrets to publish a signed
      # release APK: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD.
      # Without them the workflow falls back to a debug-signed APK.
      - name: Decode keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          LOOP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOOP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LOOP_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          LOOP_KEY_STORE: ${{ runner.temp }}/release.jks
        run: |
          ./gradlew --stacktrace :uhabits-android:assembleRelease
          cp uhabits-android/build/outputs/apk/release/*.apk "uhabits-${GITHUB_REF_NAME}.apk"

      - name: Build debug-signed APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew --stacktrace :uhabits-android:assembleDebug
          cp uhabits-android/build/outputs/apk/debug/*.apk "uhabits-${GITHUB_REF_NAME}-debug.apk"

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # Every fork tag carries a "-qol" suffix, so only flag explicit pre-release tags.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: uhabits-*.apk
